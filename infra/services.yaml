apiVersion: v1
kind: Service
metadata:
  name: qdrant-public
  namespace: qdrant
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: qdrant
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
  - name: grpc
    port: 6334
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-etcd
  namespace: milvus
spec:
  type: ClusterIP
  selector:
    app: milvus-etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-minio
  namespace: milvus
spec:
  type: ClusterIP
  selector:
    app: milvus-minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: milvus
spec:
  type: ClusterIP
  selector:
    app: milvus
  ports:
  - name: grpc
    port: 19530
    targetPort: 19530
  - name: http
    port: 9091
    targetPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-public
  namespace: milvus
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: milvus
  ports:
  - name: grpc
    port: 19530
    targetPort: 19530
